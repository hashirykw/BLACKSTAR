name: fetch-source-photos
on:
  push:
    paths: ['.github/fetch-list.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download originals
        run: |
          mkdir -p _src
          while read f; do
            [ -z "$f" ] && continue
            curl -fsSL -A "Mozilla/5.0" "https://static.wixstatic.com/media/272254_${f%.*}~mv2.${f##*.}" -o "_src/$f" || echo "fail $f"
          done < .github/fetch-list.txt
          ls -la _src
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add _src
          git commit -m "Fetch source photos" || exit 0
          git push
